name: Deploy to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site (decode icons)
        run: |
          mkdir -p _site/icons
          cp index.html style.css app.js help.js receipt.js sw.js manifest.webmanifest _site/
          (pip install -q pillow || pip install -q --break-system-packages pillow) && python3 make_icons.py _site/icons
          touch _site/.nojekyll
          ls -la _site _site/icons
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
